<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 3</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ==========================================
   WALDEN AECS PART 1 — PREMIUM WEBSITE DESIGN
   Modern | Animated | 3D | Fully Responsive
========================================== */

/* 1. GOOGLE FONT */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');

/* 2. ROOT VARIABLES */
:root {
    --bg: #080b18;
    --bg-light: #11172b;
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --accent: #ec4899;
    --text: #f8fafc;
    --muted: #a5b4cc;
    --glass: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.12);
}

/* 3. RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    padding: 60px 24px;
    position: relative;
    isolation: isolate;
    overflow-x: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 15% 15%,
            rgba(139, 92, 246, 0.16), transparent 40%),
        radial-gradient(ellipse at 85% 85%,
            rgba(6, 182, 212, 0.13), transparent 40%),
        var(--bg);

    -webkit-font-smoothing: antialiased;
}

/* 4. ANIMATED BACKGROUND LIGHTS */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    pointer-events: none;
    z-index: -1;
    will-change: transform;
}

body::before {
    top: -130px;
    left: -130px;
    background: #7c3aed;
    animation: floatPurple 12s ease-in-out infinite alternate;
}

body::after {
    right: -130px;
    bottom: -130px;
    background: #0891b2;
    animation: floatBlue 14s ease-in-out infinite alternate;
}

@keyframes floatPurple {
    0% {
        transform: translate(0, 0) scale(1);
    }
    50% {
        transform: translate(120px, 100px) scale(1.2);
    }
    100% {
        transform: translate(60px, 220px) scale(0.9);
    }
}

@keyframes floatBlue {
    0% {
        transform: translate(0, 0) scale(1);
    }
    50% {
        transform: translate(-130px, -100px) scale(1.2);
    }
    100% {
        transform: translate(-70px, -220px) scale(0.9);
    }
}

/* 5. SUBTLE BACKGROUND GRID */
body {
    background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        radial-gradient(ellipse at 15% 15%,
            rgba(139, 92, 246, 0.16), transparent 40%),
        radial-gradient(ellipse at 85% 85%,
            rgba(6, 182, 212, 0.13), transparent 40%),
        linear-gradient(135deg, #080b18, #10152a 55%, #080b18);

    background-size:
        42px 42px,
        42px 42px,
        auto,
        auto,
        auto;
    background-attachment: fixed;
}

/* 6. MAIN HEADING */
h1 {
    width: min(100%, 950px);
    margin: 0 auto 48px;
    position: relative;
    text-align: center;

    font-family: 'Outfit', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4.8rem);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -2px;

    background: linear-gradient(
        110deg,
        #ffffff 5%,
        #c4b5fd 30%,
        #67e8f9 65%,
        #f0abfc 90%
    );

    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 8px 30px rgba(139, 92, 246, 0.15));

    animation:
        headingReveal 1s ease-out both,
        gradientFlow 8s linear infinite;
}

/* Decorative heading underline */
h1::after {
    content: "";
    display: block;
    width: 100px;
    height: 4px;
    margin: 24px auto 0;
    border-radius: 100px;

    background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary),
        var(--accent)
    );

    box-shadow:
        0 0 15px rgba(139, 92, 246, 0.65),
        0 0 35px rgba(6, 182, 212, 0.3);

    animation: underlineReveal 1s 0.4s ease-out both;
}

@keyframes headingReveal {
    from {
        opacity: 0;
        transform: translateY(-30px);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: drop-shadow(0 8px 30px rgba(139, 92, 246, 0.15));
    }
}

@keyframes gradientFlow {
    to {
        background-position: 200% center;
    }
}

@keyframes underlineReveal {
    from {
        width: 0;
        opacity: 0;
    }
    to {
        width: 100px;
        opacity: 1;
    }
}

/* 7. SUBJECT CARDS */
h2 {
    width: min(100%, 680px);
    margin: 0 auto 18px;
    position: relative;

    border: 1px solid var(--border);
    border-radius: 20px;

    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.085),
        rgba(255, 255, 255, 0.025)
    );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

    transform-style: preserve-3d;
    perspective: 1000px;

    opacity: 0;
    animation: cardReveal 0.7s ease-out forwards;

    transition:
        transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 0.4s ease,
        background 0.4s ease,
        box-shadow 0.4s ease;
}

/* Staggered entrance animation */
h2:nth-of-type(1) {
    animation-delay: 0.15s;
}

h2:nth-of-type(2) {
    animation-delay: 0.3s;
}

h2:nth-of-type(3) {
    animation-delay: 0.45s;
}

h2:nth-of-type(4) {
    animation-delay: 0.6s;
}

@keyframes cardReveal {
    from {
        opacity: 0;
        transform: translateY(35px) rotateX(-8deg);
    }
    to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
    }
}

/* Glowing line across the top of each card */
h2::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 15%;
    width: 70%;
    height: 2px;
    border-radius: 50%;
    opacity: 0;
    background: linear-gradient(
        90deg,
        transparent,
        #a78bfa,
        #67e8f9,
        transparent
    );
    transition: opacity 0.4s ease;
}

/* 8. INTERACTIVE LINKS */
h2 a {
    min-height: 90px;
    padding: 25px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;

    color: #e2e8f0;
    text-decoration: none;

    font-family: 'Outfit', sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.1px;

    border-radius: inherit;

    transition:
        color 0.35s ease,
        padding 0.35s ease;
}

/* Automatically add a decorative arrow without changing HTML */
h2 a::after {
    content: "↗";
    flex-shrink: 0;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 12px;

    color: #c4b5fd;
    background: rgba(139, 92, 246, 0.1);

    font-size: 1.25rem;
    line-height: 1;

    transition:
        transform 0.35s ease,
        background 0.35s ease,
        color 0.35s ease,
        box-shadow 0.35s ease;
}

/* 9. 3D HOVER EFFECT */
@media (hover: hover) and (pointer: fine) {
    h2:hover {
        transform:
            perspective(1000px)
            translateY(-7px)
            rotateX(2deg)
            rotateY(-1deg);

        border-color: rgba(167, 139, 250, 0.55);

        background: linear-gradient(
            135deg,
            rgba(139, 92, 246, 0.16),
            rgba(6, 182, 212, 0.07)
        );

        box-shadow:
            0 24px 55px rgba(0, 0, 0, 0.3),
            0 0 30px rgba(139, 92, 246, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    h2:hover::before {
        opacity: 1;
    }

    h2:hover a {
        color: #ffffff;
        padding-left: 36px;
    }

    h2:hover a::after {
        transform: translate(3px, -3px) rotate(5deg);
        color: #ffffff;
        background: linear-gradient(135deg, #8b5cf6, #06b6d4);
        box-shadow: 0 0 22px rgba(139, 92, 246, 0.35);
    }
}

/* 10. KEYBOARD ACCESSIBILITY */
h2 a:focus-visible {
    outline: 3px solid #67e8f9;
    outline-offset: 5px;
    color: #ffffff;
}

h2:focus-within {
    border-color: #67e8f9;
}

/* 11. TABLETS */
@media (max-width: 768px) {
    body {
        padding: 55px 24px;
    }

    h1 {
        margin-bottom: 38px;
        letter-spacing: -1.5px;
    }

    h1::after {
        margin-top: 20px;
    }

    h2 {
        margin-bottom: 15px;
        border-radius: 17px;
    }

    h2 a {
        min-height: 80px;
        padding: 22px 24px;
    }

    body::before,
    body::after {
        width: 300px;
        height: 300px;
        filter: blur(85px);
    }
}

/* 12. MOBILE PHONES */
@media (max-width: 480px) {
    body {
        padding: 40px 17px;
        justify-content: center;
    }

    h1 {
        font-size: clamp(2rem, 9vw, 2.8rem);
        line-height: 1.18;
        letter-spacing: -1.2px;
        margin-bottom: 32px;
    }

    h1::after {
        width: 75px;
        height: 3px;
        margin-top: 17px;
    }

    h2 {
        width: 100%;
        margin-bottom: 13px;
        border-radius: 15px;
    }

    h2 a {
        min-height: 72px;
        padding: 18px 17px;
        gap: 12px;
        font-size: 1rem;
    }

    h2 a::after {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 1.1rem;
    }

    body::before,
    body::after {
        width: 220px;
        height: 220px;
        filter: blur(70px);
        opacity: 0.27;
    }
}

/* 13. EXTRA SMALL PHONES */
@media (max-width: 340px) {
    body {
        padding: 30px 12px;
    }

    h1 {
        font-size: 1.9rem;
        letter-spacing: -0.8px;
    }

    h2 a {
        padding: 16px 12px;
        font-size: 0.92rem;
    }

    h2 a::after {
        width: 30px;
        height: 30px;
    }
}

/* 14. REDUCE MOTION FOR ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }

    h2 {
        opacity: 1;
        transform: none;
    }
}
</style>

    </head>
    <body>
        <h1>Welcome to the Exercise 3</h1>
        <h2><a href="E3calllab.html">Call Lab</a></h2>
    </body>
</html>
